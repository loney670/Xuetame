<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#030407">
<title>CodyGame</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{--bg:#15112B;--card:#231C47;--ink:#0B0820;--coral:#FF5C7A;--cyan:#36E3D2;--sun:#FFD166;--cream:#FFF3E0;--vio:#7C5CD6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--cream);font:600 16px/1.3 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px);min-height:100vh}
main{max-width:460px;margin:0 auto}
h1{font:900 32px/1 ui-rounded,system-ui,sans-serif;letter-spacing:-.03em;margin:0}
h2{font:900 20px/1 ui-rounded,system-ui,sans-serif;margin:22px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.pill{background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.me{display:flex;gap:12px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 5px 0 var(--ink)}
.av{width:54px;height:54px;border-radius:16px;background:var(--coral);color:var(--ink);display:grid;place-items:center;font:900 26px ui-rounded,system-ui;border:3px solid var(--ink)}
.me small{display:block;opacity:.7;font-weight:600}
.g{display:grid;gap:14px}
.gc,.btn{border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);font:inherit;cursor:pointer;color:var(--ink);width:100%}
.gc{display:flex;align-items:center;gap:14px;padding:16px;text-align:left}
.gc i{font:normal 44px/1 system-ui;width:52px;text-align:center}
.gc b{display:block;font:900 22px ui-rounded,system-ui}
.gc small{font-weight:700;opacity:.75}
.gc:active,.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.c1{background:var(--vio);color:var(--cream)}.c2{background:var(--coral)}.c3{background:var(--cyan)}
.btn{background:var(--sun);padding:13px;font-weight:900;font-size:17px;border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--cream)}
ol{list-style:none;margin:0;padding:0;background:var(--card);border:3px solid var(--ink);border-radius:20px;overflow:hidden}
li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:10px 14px;border-bottom:2px solid var(--ink)}
li:last-child{border:0}li b{color:var(--sun)}li i{font-style:normal;font-weight:900}
.warn{background:var(--coral);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px;margin-bottom:14px}
#search{text-align:center;padding-top:22vh}
.sp{width:92px;height:92px;margin:0 auto 22px;border-radius:50%;border:10px solid var(--card);border-top-color:var(--coral);border-right-color:var(--cyan);animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sp{animation-duration:4s}}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:14px}
.chip{border:3px solid var(--ink);border-radius:16px;padding:8px 12px;background:var(--card);opacity:.6}
.chip.on{opacity:1;box-shadow:0 4px 0 var(--ink)}
.chip.a.on{background:var(--coral);color:var(--ink)}.chip.b.on{background:var(--cyan);color:var(--ink)}
.chip small{display:block;font-weight:600}
#sx{text-align:center;font:900 18px ui-rounded,system-ui;margin:14px 0 0;min-height:22px}
#bd{margin:14px auto;width:min(100%,430px);display:grid;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 6px 0 var(--ink)}
#bd.chess{grid-template-columns:repeat(8,1fr)}
#bd.mines{grid-template-columns:repeat(8,1fr);gap:3px;background:var(--ink);padding:3px}
#bd.ttt{grid-template-columns:repeat(3,1fr);gap:6px;background:var(--ink);padding:6px}
.sq{aspect-ratio:1;display:grid;place-items:center;position:relative;font:normal min(9.4vw,40px)/1 system-ui}
.sq.l{background:#EADFFF}.sq.d{background:var(--vio)}
.pw{color:var(--cream);text-shadow:0 0 1px var(--ink),0 0 1px var(--ink),0 2px 0 var(--ink)}
.pb{color:#1B1233;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.sel{box-shadow:inset 0 0 0 4px var(--sun)}.cap{box-shadow:inset 0 0 0 4px var(--coral)}
.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.sq.chk{background:radial-gradient(var(--coral),transparent 78%),var(--vio)}
.tc{aspect-ratio:1;background:var(--card);border-radius:14px;display:grid;place-items:center;font:900 min(22vw,90px)/1 ui-rounded,system-ui}
.tc.x{color:var(--coral)}.tc.o{color:var(--cyan)}
.mc{aspect-ratio:1;background:var(--vio);border-radius:6px;display:grid;place-items:center;font:900 min(6.2vw,24px)/1 ui-rounded,system-ui}
.mc.o{background:#EADFFF;color:var(--ink)}
.n1{color:#2B5BFF}.n2{color:#12905A}.n3{color:#E0264A}.n4,.n5,.n6,.n7,.n8{color:#7A2BD6}
.row{display:flex;gap:10px;margin-top:16px}
#res{position:fixed;inset:0;background:rgba(11,8,32,.82);display:grid;place-items:center;padding:20px}
#res div{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:28px 22px;text-align:center;width:min(100%,360px)}
#res h1{font-size:40px;margin-bottom:8px;color:var(--sun)}#res p{margin:0 0 20px;font-size:18px}

/* ---- CodyGame: чёрно-золотой скин ---- */
:root{--gold:#F5C242;--gold2:#FFE08A}
body{background:radial-gradient(110% 55% at 100% 0%,rgba(124,92,214,.38),transparent 62%),radial-gradient(90% 45% at 0% 100%,rgba(255,92,122,.22),transparent 62%),#07050F;background-attachment:fixed}
.hero{padding:22px 4px 10px}
.logo{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;mix-blend-mode:screen}
.pill{margin-left:auto;font-size:19px;padding:6px 14px;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.me{background:linear-gradient(135deg,#2B2260,#1B1540);box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 5px 0 var(--ink)}
.av{background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 0 0 3px #000,0 0 18px rgba(245,194,66,.45)}
h2{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,rgba(245,194,66,.55),transparent)}
.gc{position:relative;overflow:hidden;padding:18px 16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.28),0 6px 0 var(--ink),0 14px 28px rgba(0,0,0,.45);animation:up .5s both}
.gc>*{position:relative;z-index:1}
.gc::after{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.gc i{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.2);font-size:36px}
.c1{background:linear-gradient(135deg,#8F6CFF,#4A33A8)}.c2{background:linear-gradient(135deg,#FF7A8E,#E8431F)}.c3{background:linear-gradient(135deg,#4DF0DF,#1F8FD6)}
.gc:nth-child(2){animation-delay:.08s}.gc:nth-child(3){animation-delay:.16s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){.gc{animation:none}}
ol{background:linear-gradient(180deg,#221A4D,#171238)}
li:first-child{background:linear-gradient(90deg,rgba(245,194,66,.18),transparent)}
#bd{border-color:#000;box-shadow:0 0 0 3px var(--gold),0 8px 0 3px #000,0 18px 36px rgba(0,0,0,.5)}
.chip.on{box-shadow:0 0 0 2px var(--gold),0 4px 0 var(--ink)}

/* ---- оффлайн-игры ---- */
.c4{background:linear-gradient(135deg,#FFD166,#E08A1E)}.c5{background:linear-gradient(135deg,#9CA3FF,#4F5BD5)}
.top2{display:flex;align-items:center;gap:12px;padding-top:16px}.top2 .btn{width:auto;padding:8px 14px;font-size:15px}.top2 b{font:900 22px ui-rounded,system-ui,sans-serif}
.hint{margin:16px 0 10px;opacity:.88}
.seg{display:flex;gap:10px}
.seg button{flex:1;padding:14px 0;border:3px solid var(--ink);border-radius:16px;background:var(--card);color:var(--cream);font:900 22px ui-rounded,system-ui,sans-serif;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.seg button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink)}
#osx{text-align:center;font:900 18px ui-rounded,system-ui,sans-serif;margin:16px 0 0;min-height:22px}
#ob{margin:14px auto;width:min(100%,430px);display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:var(--ink);padding:4px;border-radius:16px;box-shadow:0 0 0 3px var(--gold),0 8px 0 3px #000,0 18px 36px rgba(0,0,0,.5)}
.gm{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font:normal min(7vw,28px)/1 system-ui;cursor:pointer;background:linear-gradient(160deg,#9B7BFF,#5B3FC4);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25)}
.gm.gem{background:radial-gradient(#8CFFF3,#1FA7C9);animation:pop .25s}
.gm.bomb{background:radial-gradient(#FF9AA8,#C71F3C);animation:pop .25s}
.gm.dim{opacity:.55;animation:none}
.mc.bomb{background:#FFB3BE}
.btn:disabled{opacity:.5}
@keyframes pop{from{transform:scale(.6)}}
@media(prefers-reduced-motion:reduce){.gm{animation:none!important}}

/* ---- CodyGame v3: чёрное стекло и золото ---- */
:root{--card:#0E0C14;--vio:#8B6A24}
body{background:#030407}
.hero{padding:10px 4px 2px}.logo{max-width:210px}
.me{background:linear-gradient(135deg,#1A1522,#0A0810);border:1.5px solid rgba(245,194,66,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 22px rgba(245,194,66,.14),0 10px 22px rgba(0,0,0,.6)}
.gc::after{display:none}
.gc.img{display:block;padding:0;border:0;background:none;box-shadow:none;border-radius:0;overflow:visible;animation:none}
.gc.img img{display:block;width:100%;height:auto;mix-blend-mode:screen}
.gc.img:active{transform:scale(.97);box-shadow:none}
.gc.gx{color:#fff;border:1.5px solid var(--a);border-radius:26px;background:linear-gradient(110deg,#0B0810 35%,var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 24px var(--c),0 10px 22px rgba(0,0,0,.6)}
.gc.gx i{border:1.5px solid var(--a);background:rgba(255,255,255,.07);box-shadow:inset 0 0 16px var(--c)}
.gc.gx b{text-shadow:0 0 14px var(--c)}
.gc.gx small{color:rgba(255,255,255,.72);opacity:1}
.btn{border:0;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 4px 0 #8A6414,0 8px 18px rgba(245,194,66,.22)}
.btn:active{box-shadow:0 0 0 #8A6414}
.btn.alt{background:#13101B;color:var(--cream);border:1.5px solid rgba(245,194,66,.4);box-shadow:0 4px 0 #000}
.seg{flex-wrap:wrap}
.seg button{flex:1 0 calc(20% - 8px);padding:12px 0;font-size:20px;background:#13101B;border:1.5px solid rgba(245,194,66,.35);box-shadow:0 3px 0 #000}
.sq.l,.mc.o{background:#F4E7BE}.sq.d{background:#8B6A24}
.pb{color:#120D05;text-shadow:0 0 1px rgba(255,255,255,.6),0 1px 0 rgba(255,255,255,.25)}
.mc{background:linear-gradient(160deg,#C69A33,#7A5A1E);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.25)}
.mc.o{box-shadow:none}.mc.bomb{background:#FFB3BE}
.tc{background:#0E0C14;box-shadow:inset 0 0 0 1.5px rgba(245,194,66,.25)}
.chip{background:#0E0C14;border:1.5px solid rgba(245,194,66,.4)}
ol{background:#0C0A12;border:1.5px solid rgba(245,194,66,.35)}
li{border-bottom:1px solid rgba(245,194,66,.15)}
#res div{background:linear-gradient(160deg,#17121F,#07060B);border:1.5px solid var(--gold);box-shadow:0 0 30px rgba(245,194,66,.25)}
.sp{border-color:#1B1710;border-top-color:var(--gold);border-right-color:var(--gold2)}

/* ---- нижняя панель и вкладки ---- */
main{padding-bottom:104px}.logo{max-width:250px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:20;display:flex;width:min(100%,460px);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(8,7,12,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid rgba(245,194,66,.35);border-bottom:0;border-radius:22px 22px 0 0}
#nav button{flex:1;display:grid;justify-items:center;gap:2px;padding:7px 0;border:0;border-radius:14px;background:none;color:rgba(255,243,224,.55);font:800 12px ui-rounded,system-ui,sans-serif;cursor:pointer}
#nav button i{font:normal 22px/1 system-ui}
#nav button.on{color:var(--gold);background:rgba(245,194,66,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pf{text-align:center;padding-top:20px}
.av.big{width:96px;height:96px;margin:0 auto 14px;border-radius:28px;font-size:48px}
.pf .pill{display:inline-block;margin:12px 0 20px;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:#0E0C14;border:1.5px solid rgba(245,194,66,.3);border-radius:16px;padding:12px 2px;font-size:12px}
.stats b{display:block;margin-bottom:2px;font:900 22px ui-rounded,system-ui,sans-serif;color:var(--gold)}
li.mine{background:linear-gradient(90deg,rgba(245,194,66,.25),transparent)}

/* ---- v4: круглые авы, нижняя панель, топ, профиль ---- */
.ic{width:20px;height:20px;flex:none}
.av{border:0;border-radius:50%;overflow:hidden;flex:none;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{border-radius:50%}
.btn{border-radius:16px}
.btn .ic{width:22px;height:22px}
.btn.alt{background:rgba(255,255,255,.05);border:1.5px solid rgba(245,194,66,.45);color:var(--cream)}
.me{padding:14px;gap:14px;border-radius:24px;border:1.5px solid rgba(245,194,66,.5);background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.015) 60%),#0B0911;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 26px rgba(245,194,66,.12),0 12px 24px rgba(0,0,0,.55)}
.me .av{width:60px;height:60px;font-size:28px;box-shadow:0 0 0 2px rgba(245,194,66,.7),0 0 16px rgba(245,194,66,.35)}
.mi{flex:1;min-width:0}
.mn{font:900 19px/1.15 ui-rounded,system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{font-size:12.5px;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;box-shadow:0 0 16px rgba(245,194,66,.35);font-size:17px;padding:7px 13px}
.pill .ic{width:18px;height:18px}
.row2{gap:12px}
.row2 .btn{display:flex;align-items:center;justify-content:center;gap:9px;height:58px;padding:0 10px;border-radius:18px;font-size:17px}
.row2 .btn:not(.alt){box-shadow:0 4px 0 #8A6414,0 10px 26px rgba(245,194,66,.3)}

/* нижняя панель */
#nav{background:linear-gradient(90deg,#1e1a29 0%,#1b2229 55%,#222a1b 100%);border:0;border-top:1px solid rgba(255,255,255,.08);border-radius:22px 22px 0 0;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
#nav button{gap:5px;padding:4px 0;border-radius:0;background:none;color:rgba(255,255,255,.46);font:500 12.5px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#nav button.on{background:none;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.35)}
#nav .ni{width:28px;height:28px}
#nav button.on .ni{filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}

/* игроки в партии */
.chip{display:flex;align-items:center;gap:9px;min-width:0}
.chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .av{width:34px;height:34px;font-size:16px;box-shadow:0 0 0 2px rgba(245,194,66,.4)}

/* топ: пьедестал */
.pod{display:grid;grid-template-columns:1fr 1.14fr 1fr;gap:10px;align-items:end;margin:8px 0 20px}
.pc{--c:#fff;--g:transparent;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:20px 6px 14px;border-radius:22px;border:1.5px solid var(--c);text-align:center;background:radial-gradient(120% 70% at 50% 0%,var(--g),transparent 70%),#0A0810;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 24px var(--g),0 10px 20px rgba(0,0,0,.55)}
.pc.p1{--c:#FFD35A;--g:rgba(255,211,90,.34);padding:32px 6px 18px}
.pc.p2{--c:#D3DAE6;--g:rgba(211,218,230,.22)}
.pc.p3{--c:#E39A5B;--g:rgba(227,154,91,.26)}
.pc.mine{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.pa{position:relative;margin-bottom:14px}
.pa .av{width:64px;height:64px;font-size:28px;box-shadow:0 0 0 3px var(--c),0 0 20px var(--g)}
.pc.p1 .pa .av{width:84px;height:84px;font-size:38px}
.crown{position:absolute;top:-29px;left:50%;transform:translateX(-50%);width:34px;height:34px;color:#FFD35A;filter:drop-shadow(0 0 8px rgba(255,211,90,.7))}
.rk{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;font:900 14px ui-rounded,system-ui,sans-serif;color:#17110A;background:linear-gradient(180deg,#fff,var(--c));border:2px solid #000}
.pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 14px/1.25 ui-rounded,system-ui,sans-serif}
.pc.p1 .pn{font-size:16px}
.pr{font:900 17px ui-rounded,system-ui,sans-serif;font-style:normal;color:var(--c)}
.pr small{display:block;font:700 10px system-ui,sans-serif;letter-spacing:.12em;color:var(--cream);opacity:.65}
/* топ: список с 4 места */
#top li{grid-template-columns:34px 38px 1fr auto;align-items:center;gap:10px;padding:9px 14px}
#top li b{color:rgba(255,243,224,.55);font:800 15px ui-rounded,system-ui,sans-serif;text-align:center}
#top li .av{width:38px;height:38px;font-size:17px;box-shadow:0 0 0 2px rgba(245,194,66,.3)}
#top li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
#top li i{color:var(--gold);font-weight:900}
#top li:first-child{background:none}
#top li.mine,#top li.mine:first-child{background:linear-gradient(90deg,rgba(245,194,66,.25),transparent)}
#top li.mine b{color:var(--gold)}

/* профиль */
.avbox{position:relative;width:112px;margin:0 auto 14px}
.pf .av.big{width:112px;height:112px;font-size:52px;margin:0;box-shadow:0 0 0 3px #000,0 0 0 5px rgba(245,194,66,.8),0 0 28px rgba(245,194,66,.35)}
.cam{position:absolute;right:-2px;bottom:0;width:36px;height:36px;padding:0;border-radius:50%;border:2px solid #000;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#17110A;display:grid;place-items:center;cursor:pointer}
.cam .ic{width:18px;height:18px}
.pf h1{font-size:28px;margin:0;overflow:hidden;text-overflow:ellipsis}
.pf .pill{margin:12px 0 14px;font-size:20px}
.pf .pill .ic{width:24px;height:24px}
.btn.sm{width:auto;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;font-size:15px;margin-bottom:18px}
.editor{text-align:left;display:grid;gap:12px;margin:2px 0 18px;padding:14px;border-radius:20px;background:#0B0911;border:1.5px solid rgba(245,194,66,.35)}
.fl{display:grid;gap:6px;font-size:12px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.fl input{font:700 17px ui-rounded,system-ui,sans-serif;letter-spacing:0;text-transform:none;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(245,194,66,.4);background:#13101B;color:var(--cream);outline:none}
.fl input:focus{border-color:var(--gold)}
.editor .row{margin-top:0}
.editor .hint{margin:0;min-height:18px;color:var(--coral)}

<script>
const CFG=window.CFG||{}, SB_URL=String(CFG.url||window.SUPABASE_URL||'https://YOUR-PROJECT.supabase.co').trim().replace(/\/(rest\/v1)?\/?$/,''), SB_KEY=String(CFG.key||window.SUPABASE_ANON_KEY||window.SUPABASE_KEY||'YOUR-PUBLISHABLE-KEY').trim();

const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tg=window.Telegram&&Telegram.WebApp;
try{tg.ready();tg.expand();tg.setHeaderColor('#030407');tg.setBackgroundColor('#030407')}catch(e){}
const tu=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user, qs=new URLSearchParams(location.search);
let uid;try{uid=localStorage.uid||(localStorage.uid=1e8+Math.floor(Math.random()*9e8))}catch(e){uid=Date.now()}
const me={id:tu?tu.id:+(qs.get('u')||uid)};
me.name=tu?tu.first_name:'Игрок '+String(me.id).slice(-3);
const NAMES={chess:'Шахматы',mines:'Сапёр',ttt:'Крестики-нолики'}, GL={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const sb=supabase.createClient(SB_URL,SB_KEY);
let G,opp,ch,pollT,sel,mine,flagMode,meRow,over;

const show=id=>{['home','search','game','off'].forEach(x=>$('#'+x).hidden=x!==id);$('#nav').hidden=id!=='home'};

const PLAYED='wins.gt.0,losses.gt.0,draws.gt.0';
const avIn=p=>p&&p.avatar&&/^data:image\//.test(p.avatar)?`<img alt="" src="${esc(p.avatar)}">`:esc([...(p&&p.name||'?')][0]||'?');
const avh=(p,c)=>`<div class="av${c?' '+c:''}">${avIn(p)}</div>`;
const cupRt=r=>`<svg class="ic"><use href="#i-cup"/></svg>${r}`;
async function login(){
  let {data}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
  if(!data){await sb.from('profiles').insert({id:me.id,name:me.name,rating:500});({data}=await sb.from('profiles').select('*').eq('id',me.id).single())}
  meRow=data;
  $('#av').innerHTML=avIn(data);$('#nm').textContent=data.name;$('#rt').innerHTML=cupRt(data.rating);
  $('#st').textContent=`${data.wins} побед · ${data.losses} поражений · ${data.draws} ничьих`;
  fillProfile();
}
async function loadTop(){
  let r=await sb.from('profiles').select('id,name,rating,avatar').or(PLAYED).order('rating',{ascending:false}).order('id',{ascending:true}).limit(100);
  if(r.error)r=await sb.from('profiles').select('id,name,rating').or(PLAYED).order('rating',{ascending:false}).order('id',{ascending:true}).limit(100);
  const L=r.data||[];
  $('#pod').innerHTML=[1,0,2].map(i=>{const p=L[i];if(!p)return '<div></div>';
    return `<div class="pc p${i+1}${p.id===me.id?' mine':''}"><div class="pa">${i===0?'<svg class="crown"><use href="#i-crown"/></svg>':''}${avh(p)}<span class="rk">${i+1}</span></div><b class="pn">${esc(p.name)}</b><i class="pr">${p.rating}<small>ММР</small></i></div>`}).join('');
  const played=!!meRow&&meRow.wins+meRow.losses+meRow.draws>0,nt=$('#topnote');
  nt.textContent=!L.length?'Пока в топе никого. Сыграй партию, и ты станешь первым!':'Ты появишься в топе после первой сыгранной партии.';
  nt.hidden=L.length>0&&played;
  $('#pod').hidden=!L.length;
  const rest=L.slice(3);$('#top').hidden=!rest.length;
  $('#top').innerHTML=rest.map((p,k)=>`<li class="${p.id===me.id?'mine':''}"><b>${k+4}</b>${avh(p)}<span>${esc(p.name)}</span><i>${p.rating}</i></li>`).join('');
}

async function search(kind){
  show('search');$('#sk').textContent=NAMES[kind];
  const {data,error}=await sb.rpc('join_queue',{p_player:me.id,p_kind:kind});
  if(error){alert('Не удалось начать поиск: '+error.message);return show('home')}
  if(data)return openGame(data);
  pollT=setInterval(async()=>{
    const {data}=await sb.from('games').select('id').eq('p1',me.id).eq('status','active').limit(1);
    if(data&&data[0]){clearInterval(pollT);openGame(data[0].id)}
  },1500);
}
async function cancel(){clearInterval(pollT);await sb.from('queue').delete().eq('player',me.id);show('home')}

async function openGame(id){
  const {data:g}=await sb.from('games').select('*').eq('id',id).single();
  const {data:ps}=await sb.from('profiles').select('*').in('id',[g.p1,g.p2]);
  G=g;opp=ps.find(p=>p.id!==me.id);sel=null;mine=null;flagMode=false;over=false;
  $('#res').hidden=true;show('game');
  ch=sb.channel('g'+id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'games',filter:'id=eq.'+id},p=>{G=p.new;draw()}).subscribe();
  pollT=setInterval(async()=>{const {data}=await sb.from('games').select('*').eq('id',id).single();if(data&&JSON.stringify(data)!==JSON.stringify(G)){G=data;draw()}},3000);
  draw();
}

// кто ходит сейчас: true — я
function myTurn(){
  if(G.kind==='chess')return new Chess(G.state.fen).turn()===(G.state.white===me.id?'w':'b');
  if(G.kind==='ttt')return G.state.turn===(G.p1===me.id?1:2);
  return true;
}
function draw(){
  const live=G.status==='active', t=live&&myTurn();
  const mark=G.kind==='chess'?(G.state.white===me.id?'♔ белые':'♚ чёрные'):G.kind==='ttt'?(G.p1===me.id?'✕':'◯'):'';
  const omark=G.kind==='chess'?(G.state.white===me.id?'♚ чёрные':'♔ белые'):G.kind==='ttt'?(G.p1===me.id?'◯':'✕'):'';
  const pa=$('#pa'),pb=$('#pb2');
  pa.innerHTML=`${avh(meRow)}<span>${esc(meRow.name)}<small>${meRow.rating} ${mark}</small></span>`;pb.innerHTML=`${avh(opp)}<span>${esc(opp.name)}<small>${opp.rating} ${omark}</small></span>`;
  pa.classList.toggle('on',live&&(G.kind==='mines'||t));pb.classList.toggle('on',live&&(G.kind==='mines'||!t));
  ({chess:drawChess,ttt:drawTtt,mines:drawMines})[G.kind]();
  $('#resign').hidden=!live;
  if(!live)endGame();
}
async function push(state,winner){ // winner: undefined — партия идёт, null — ничья, id — победа
  G={...G,state};draw();
  await sb.from('games').update({state}).eq('id',G.id);
  if(winner!==undefined)await sb.rpc('finish_game',{p_game:G.id,p_winner:winner});
}
async function endGame(){
  if(over)return;over=true;clearInterval(pollT);ch&&sb.removeChannel(ch);
  const old=meRow.rating;await login();const d=meRow.rating-old,w=G.winner;
  $('#r1').textContent=w==null?'Ничья':w===me.id?'Победа!':'Поражение';
  $('#r2').textContent=`Рейтинг ${meRow.rating} (${d>=0?'+':''}${d})`;$('#res').hidden=false;
}

// ---------- шахматы ----------
function drawChess(){
  const c=new Chess(G.state.fen),my=G.state.white===me.id?'w':'b',flip=my==='b',b=c.board();
  const tg2=sel?c.moves({square:sel,verbose:true}):[];let h='';
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const R=flip?7-r:r,F=flip?7-f:f,s='abcdefgh'[F]+(8-R),p=b[R][F],t=tg2.some(m=>m.to===s);
    const chk=p&&p.type==='k'&&p.color===c.turn()&&c.in_check();
    h+=`<div class="sq ${(R+F)%2?'d':'l'}${s===sel?' sel':''}${t?(p?' cap':' mv'):''}${chk?' chk':''}" data-i="${s}">${p?`<span class="${p.color==='w'?'pw':'pb'}">${GL[p.type]}\uFE0E</span>`:''}</div>`;
  }
  $('#bd').className='chess';$('#bd').innerHTML=h;
  $('#sx').textContent=G.status!=='active'?'Партия окончена':c.turn()===my?(c.in_check()?'Шах! Твой ход':'Твой ход'):'Ход соперника…';
}
function tapChess(s){
  const c=new Chess(G.state.fen),my=G.state.white===me.id?'w':'b';if(c.turn()!==my)return;
  if(sel&&sel!==s&&c.move({from:sel,to:s,promotion:'q'})){
    sel=null;push({...G.state,fen:c.fen()},c.game_over()?(c.in_checkmate()?me.id:null):undefined);return;
  }
  const p=c.get(s);sel=p&&p.color===my?s:null;draw();
}

// ---------- крестики-нолики ----------
function drawTtt(){
  $('#bd').className='ttt';
  $('#bd').innerHTML=[...G.state.b].map((v,i)=>`<div class="tc ${v==='X'?'x':v==='O'?'o':''}" data-i="${i}">${v==='X'?'✕':v==='O'?'◯':''}</div>`).join('');
  $('#sx').textContent=G.status!=='active'?'Партия окончена':myTurn()?'Твой ход':'Ход соперника…';
}
function tapTtt(i){
  const s=G.state,n=G.p1===me.id?1:2;if(s.turn!==n||s.b[i]!==' ')return;
  const b=s.b.split('');b[i]=n===1?'X':'O';
  const win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(l=>l.every(j=>b[j]===b[i]));
  push({b:b.join(''),turn:3-n},win?me.id:b.includes(' ')?undefined:null);
}

// ---------- сапёр: одно поле на двоих, центр открыт, кто первый очистит — победил ----------
function mkMines(seed){
  let a=seed>>>0;const rnd=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const cells=[...Array(64).keys()].filter(i=>{const r=i>>3,c=i&7;return !(r>=3&&r<=5&&c>=3&&c<=5)});
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
  const m=new Set(cells.slice(0,10)),near=i=>{let k=0;for(let d=0;d<9;d++){const R=(i>>3)+Math.floor(d/3)-1,C=(i&7)+d%3-1;if(R>=0&&R<8&&C>=0&&C<8&&m.has(R*8+C))k++}return k};
  return {m,num:[...Array(64).keys()].map(near),open:new Set(),flag:new Set()};
}
function reveal(i){
  const M=mine;if(M.open.has(i)||M.flag.has(i))return;M.open.add(i);
  if(M.num[i]===0&&!M.m.has(i))for(let d=0;d<9;d++){const R=(i>>3)+Math.floor(d/3)-1,C=(i&7)+d%3-1;if(R>=0&&R<8&&C>=0&&C<8)reveal(R*8+C)}
}
function drawMines(){
  if(!mine){mine=mkMines(G.state.seed);reveal(36)}
  let h='';
  for(let i=0;i<64;i++){
    const o=mine.open.has(i);
    h+=`<div class="mc${o?' o':''}${o&&!mine.m.has(i)&&mine.num[i]?' n'+mine.num[i]:''}" data-i="${i}">${o?(mine.m.has(i)?'<i class="eb"></i>':mine.num[i]||''):mine.flag.has(i)?'🚩':''}</div>`;
  }
  $('#bd').className='mines';$('#bd').innerHTML=h;
  $('#tool').hidden=false;$('#tool').textContent=flagMode?'🚩 Флажок':'⛏ Открыть';
  $('#sx').textContent=G.status!=='active'?'Партия окончена':`Открыто ${mine.open.size}/54 — кто первый очистит поле`;
}
function tapMines(i){
  i=+i;
  if(flagMode){if(!mine.open.has(i))mine.flag.has(i)?mine.flag.delete(i):mine.flag.add(i);return draw()}
  if(mine.open.has(i)||mine.flag.has(i))return;
  if(mine.m.has(i)){mine.open.add(i);return push(G.state,opp.id)}
  reveal(i);
  push(G.state,mine.open.size>=54?me.id:undefined);
}

// ---------- оффлайн: Мины и Сапёр ----------
const rng=m=>m<3?[1,5]:[m,2*m];
const rew=(m,g)=>{const [a,b]=rng(m);return a+Math.round((b-a)*Math.min(1,g/10))};
const nbs=i=>{const r=i>>3,c=i&7,o=[];for(let d=0;d<9;d++){const R=r+Math.floor(d/3)-1,C=c+d%3-1;if(d!==4&&R>=0&&R<8&&C>=0&&C<8)o.push(R*8+C)}return o};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const all64=()=>[...Array(64).keys()];
let O=null,tm=null;
function leaveOff(){clearInterval(tm);O=null;show('home');login()}
function openOff(kind){
  clearInterval(tm);show('off');$('#res').hidden=true;
  $('#otitle').innerHTML=kind==='gems'?'Мины <i class="eg"></i>':'Сапёр';
  kind==='gems'?gemSetup(3):newSweep();
}

// Мины: 8×8, под клетками алмаз или бомба, забирай награду когда хочешь
function gemSetup(m){
  O={kind:'gems',m};
  $('#ob').hidden=true;$('#otool').hidden=true;$('#cash').hidden=true;$('#osx').textContent='';$('#setup').hidden=false;
  $('#setup').innerHTML=`<p class="hint">Сколько мин спрятать? Чем больше, тем выше награда.</p>
  <div class="seg">${Array.from({length:15},(_,k)=>k+1).map(n=>`<button data-m="${n}" class="${n===m?'on':''}">${n}</button>`).join('')}</div>
  <p class="hint">Награда: <b>${rng(m)[0]}–${rng(m)[1]} ММР</b>. Чем больше <i class="eg"></i> соберёшь до выхода, тем ближе к максимуму (он после 10 <i class="eg"></i>). Попал на мину — ММР не даётся.</p>
  <button class="btn" id="go">Играть</button>`;
}
function startGems(m){
  O={kind:'gems',m,mines:new Set(shuf(all64()).slice(0,m)),open:new Set(),over:false,won:false,gems:0};
  $('#setup').hidden=true;$('#ob').hidden=false;drawGems();
}
function drawGems(){
  let h='';
  for(let i=0;i<64;i++){
    const o=O.open.has(i),bomb=O.mines.has(i),vis=o||O.over;
    h+=`<div class="gm${vis?(bomb?' bomb':' gem'):''}${vis&&!o?' dim':''}" data-i="${i}"></div>`;
  }
  $('#ob').innerHTML=h;
  const g=O.gems,c=$('#cash');c.hidden=false;
  $('#osx').innerHTML=O.over?(O.won?'Ты забрал награду!':'Мина! Игра окончена'):`<i class="eg"></i> ${g} · <i class="eb"></i> ${O.m}`;
  if(O.over){c.textContent='Играть снова';c.disabled=false;c.onclick=()=>gemSetup(O.m)}
  else{c.textContent=g?`Забрать +${rew(O.m,g)} ММР`:'Открой первую клетку';c.disabled=!g;c.onclick=cashOut}
}
function tapGem(i){
  if(O.over||O.open.has(i))return;
  O.open.add(i);
  if(O.mines.has(i)){O.over=true}else O.gems++;
  drawGems();
}
async function cashOut(){
  if(O.over||!O.gems)return;
  const g=O.gems,m=O.m;O.over=true;O.won=true;drawGems();
  const {data}=await sb.rpc('offline_reward',{p_player:me.id,p_mines:m,p_gems:g});
  await login();
  $('#r1').textContent='Забрал награду!';
  $('#r2').textContent=data?`+${data} ММР · всего ${meRow.rating}`:'ММР не начислен: слишком часто, подожди немного';
  $('#res').hidden=false;
}

// Сапёр: 8×8, 10 мин, первый ход безопасный
function newSweep(){
  clearInterval(tm);
  O={kind:'sweep',open:new Set(),flag:new Set(),over:false,won:false,t0:0,t1:0,fm:false};
  $('#setup').hidden=true;$('#ob').hidden=false;$('#otool').hidden=false;$('#cash').hidden=true;
  drawSweep();
}
function sweepStart(first){
  const ex=new Set([first,...nbs(first)]);
  O.mines=new Set(shuf(all64().filter(i=>!ex.has(i))).slice(0,10));
  O.num=all64().map(i=>nbs(i).filter(j=>O.mines.has(j)).length);
  O.t0=Date.now();tm=setInterval(()=>{if(O&&O.kind==='sweep'&&!O.over)sweepStatus()},1000);
}
function sweepOpen(i){
  if(O.open.has(i)||O.flag.has(i))return;
  O.open.add(i);if(!O.num[i])nbs(i).forEach(sweepOpen);
}
function tapSweep(i){
  if(O.over)return;
  if(O.fm){if(!O.open.has(i))O.flag.has(i)?O.flag.delete(i):O.flag.add(i);return drawSweep()}
  if(!O.mines)sweepStart(i);
  if(O.open.has(i)||O.flag.has(i))return;
  if(O.mines.has(i)){O.over=true}
  else{sweepOpen(i);if(O.open.size===54){O.over=true;O.won=true}}
  if(O.over)O.t1=Date.now();
  drawSweep();
}
function drawSweep(){
  let h='';
  for(let i=0;i<64;i++){
    const o=O.open.has(i),mn=!!(O.mines&&O.mines.has(i)),rv=O.over&&mn&&!o,n=o?O.num[i]:0;
    h+=`<div class="mc${o?' o':''}${n?' n'+n:''}${rv?' o bomb':''}" data-i="${i}">${o?(n||''):rv?'<i class="eb"></i>':O.flag.has(i)?'🚩':''}</div>`;
  }
  $('#ob').innerHTML=h;$('#otool').textContent=O.fm?'🚩 Флажок':'⛏ Открыть';
  const c=$('#cash');
  if(O.over){c.hidden=false;c.disabled=false;c.textContent='Заново';c.onclick=newSweep}
  sweepStatus();
}
function sweepStatus(){
  const s=O.t0?Math.floor(((O.t1||Date.now())-O.t0)/1000):0,t=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('#osx').innerHTML=O.over?(O.won?`🏆 Победа! Время ${t}`:'💥 Бум! Попробуй ещё'):`<i class="eb"></i> ${10-O.flag.size} · ⏱ ${t}`;
}

// ---------- вкладки и профиль ----------
function tab(n){['menu','games','top','me'].forEach(x=>{$('#p-'+x).hidden=x!==n;$('#t-'+x).classList.toggle('on',x===n)});if(n==='top')loadTop();if(n!=='me')closeEdit();scrollTo(0,0)}
let pend; // undefined — ава не менялась, null — убрать, строка — новая
async function fillProfile(){
  const d=meRow;if(!d)return;
  showAv();$('#nm2').textContent=d.name;$('#rt2').innerHTML=cupRt(d.rating);
  $('#sw').textContent=d.wins;$('#sl').textContent=d.losses;$('#sd').textContent=d.draws;
  const n=d.wins+d.losses+d.draws;$('#sr').textContent=n?Math.round(d.wins*100/n)+'%':'—';
  if(n===0)$('#rank').textContent='Сыграй первую партию, и ты появишься в топе';
  else{const {count}=await sb.from('profiles').select('id',{count:'exact',head:true}).or(PLAYED).or(`rating.gt.${d.rating},and(rating.eq.${d.rating},id.lt.${d.id})`);
    $('#rank').textContent=count==null?'':'Место в топе: '+(count+1)}
}
function showAv(){
  if(!meRow)return;const ed=!$('#editor').hidden;
  $('#av2').innerHTML=avIn({name:ed?($('#nick').value||meRow.name):meRow.name,avatar:ed&&pend!==undefined?pend:meRow.avatar});
}
const emsg=t=>$('#emsg').textContent=t||'';
function openEdit(){if(!meRow)return;pend=undefined;$('#nick').value=meRow.name;emsg();$('#editor').hidden=false;$('#edit').hidden=true;showAv()}
function closeEdit(){pend=undefined;$('#editor').hidden=true;$('#edit').hidden=false;showAv()}
function fileToAvatar(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error('read'));r.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('img'));im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);ok(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)})}
async function saveProfile(){
  const name=[...$('#nick').value.replace(/\s+/g,' ').trim()];
  if(name.length<2)return emsg('Ник: от 2 до 16 символов');
  const patch={name:name.slice(0,16).join('')};if(pend!==undefined)patch.avatar=pend;
  const b=$('#save');b.disabled=true;
  const {data,error}=await sb.from('profiles').update(patch).eq('id',me.id).select('id');
  b.disabled=false;
  if(error)return emsg(/avatar/i.test(error.message)?'Нужно один раз выполнить SQL из файла supabase_profile.sql':'Не удалось сохранить: '+error.message);
  if(!data||!data.length)return emsg('Нет прав на изменение профиля (проверь политики Supabase)');
  closeEdit();await login();
}

// ---------- события ----------
$('#bd').addEventListener('click',e=>{
  const c=e.target.closest('[data-i]');if(!c||!G||G.status!=='active')return;
  ({chess:tapChess,ttt:tapTtt,mines:tapMines})[G.kind](c.dataset.i);
});
document.querySelectorAll('.gc[data-k]').forEach(b=>b.onclick=()=>search(b.dataset.k));
document.querySelectorAll('.gc[data-o]').forEach(b=>b.onclick=()=>openOff(b.dataset.o));
$('#ob').addEventListener('click',e=>{const c=e.target.closest('[data-i]');if(c&&O)(O.kind==='gems'?tapGem:tapSweep)(+c.dataset.i)});
$('#setup').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.m)gemSetup(+b.dataset.m);else if(b.id==='go')startGems(O.m)};
$('#oback').onclick=leaveOff;
$('#otool').onclick=()=>{if(O&&O.kind==='sweep'){O.fm=!O.fm;drawSweep()}};
$('#cancel').onclick=cancel;
$('#tool').onclick=()=>{flagMode=!flagMode;draw()};
$('#resign').onclick=()=>{if(G.status==='active'&&confirm('Сдаться?'))sb.rpc('finish_game',{p_game:G.id,p_winner:opp.id})};
$('#back').onclick=()=>{$('#res').hidden=true;show('home')};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>tab(b.dataset.t));

$('#edit').onclick=openEdit;$('#ecancel').onclick=closeEdit;$('#save').onclick=saveProfile;
$('#camb').onclick=()=>{if($('#editor').hidden)openEdit();$('#file').click()};
$('#pick').onclick=()=>$('#file').click();
$('#rmav').onclick=()=>{pend=null;showAv()};
$('#nick').oninput=showAv;
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{pend=await fileToAvatar(f);emsg();showAv()}catch(x){emsg('Не удалось прочитать картинку')}};
if(SB_URL.includes('YOUR-')){console.warn('config.js не найден')}
else login().catch(e=>{$('#warn').hidden=false;$('#warn').textContent='Не удалось подключиться к Supabase: '+e.message});
</script></body></html>
